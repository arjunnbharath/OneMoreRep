apply plugin: 'com.android.application'

// OneDrive locks files inside the repo while Gradle is writing them.
def localAppData = System.getenv("LOCALAPPDATA")
if (localAppData) {
    layout.buildDirectory.set(new File(localAppData, "onemorerep-android-build/app"))
}

android {
    namespace = "com.onemorerep.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.onemorerep.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // "downloads" holds the published APK + version.json for the website; never bundle it into the app.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!downloads'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// OneDrive leaves freshly synced web assets as placeholders that Gradle cannot
// snapshot ("not a regular file"). Mirror them outside OneDrive before building
// and point the asset source set at the mirror.
if (localAppData) {
    def mirroredAssets = new File(localAppData, "onemorerep-android-build/assets")
    android.sourceSets.main.assets.srcDirs = [mirroredAssets]

    tasks.register("mirrorAssetsOutsideOneDrive") {
        doNotTrackState("Reads OneDrive placeholder files that Gradle cannot snapshot")
        doLast {
            def source = file("src/main/assets").toPath()
            def target = mirroredAssets.toPath()
            if (mirroredAssets.exists()) mirroredAssets.deleteDir()
            java.nio.file.Files.createDirectories(target)
            java.nio.file.Files.walk(source).forEach { path ->
                def relative = source.relativize(path).toString()
                if (relative.replace('\\', '/').startsWith("public/downloads")) return
                def dest = target.resolve(relative)
                if (java.nio.file.Files.isDirectory(path)) {
                    java.nio.file.Files.createDirectories(dest)
                } else {
                    java.nio.file.Files.copy(path, dest, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
    preBuild.dependsOn("mirrorAssetsOutsideOneDrive")
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
