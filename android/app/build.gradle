apply plugin: 'com.android.application'

// OneDrive locks files inside the repo while Gradle is writing them.
def localAppData = System.getenv("LOCALAPPDATA")
if (localAppData) {
    layout.buildDirectory.set(new File(localAppData, "onemorerep-android-build/app"))
}

android {
    namespace = "com.onemorerep.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.onemorerep.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // "downloads" holds the published APK + version.json for the website; never bundle it into the app.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!downloads'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// OneDrive hands Gradle placeholder files and stale snapshots, so the web
// assets are copied outside OneDrive on every build and packaged from there.
if (localAppData) {
    def sourceAssets = file("src/main/assets")
    def mirroredAssets = new File(localAppData, "onemorerep-android-build/assets")
    android.sourceSets.main.assets.srcDirs = [mirroredAssets]

    tasks.register("mirrorAssetsOutsideOneDrive") {
        doNotTrackState("Reads OneDrive files that Gradle cannot snapshot reliably")
        doLast {
            project.delete(mirroredAssets)
            mirroredAssets.mkdirs()
            def root = sourceAssets.toPath()
            java.nio.file.Files.walk(root).forEach { path ->
                def rel = root.relativize(path).toString().replace('\\', '/')
                if (rel.isEmpty() || rel.startsWith("public/downloads")) return
                def target = new File(mirroredAssets, rel)
                if (java.nio.file.Files.isDirectory(path)) {
                    target.mkdirs()
                } else {
                    target.parentFile.mkdirs()
                    java.nio.file.Files.copy(path, target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
    preBuild.dependsOn("mirrorAssetsOutsideOneDrive")
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
